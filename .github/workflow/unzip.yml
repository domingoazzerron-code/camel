name: Unzip site

on:
  push:
    paths:
      - "weddingsite-reorganized.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip to root
        run: |
          if [ ! -f "weddingsite-reorganized.zip" ]; then
            echo "Zip not found"
            exit 1
          fi
          echo "Extracting weddingsite-reorganized.zip..."
          unzip -o weddingsite-reorganized.zip -d .
          echo "Removing zip..."
          rm -f weddingsite-reorganized.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract site from zip and remove archive"
            git push
          fi
